<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>响应式网站示例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #3498db;
        }

        main {
            padding: 2rem 0;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            min-width: 120px;
            text-align: center;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            header .container {
                flex-direction: column;
                gap: 1rem;
            }
            
            nav ul {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            
            .card-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 10px;
            }
            
            .card {
                padding: 1rem;
            }
            
            .btn {
                width: 100%;
                padding: 15px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>响应式网站</h1>
            <nav>
                <ul>
                    <li><a href="#home">首页</a></li>
                    <li><a href="#about">关于我们</a></li>
                    <li><a href="#services">服务</a></li>
                    <li><a href="#contact">联系我们</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="home">
            <h2>欢迎访问我们的网站</h2>
            <p>这个网站可以在桌面端、平板和手机上完美显示。尝试调整浏览器窗口大小来体验响应式效果。</p>
        </section>

        <section id="services">
            <h2>我们的服务</h2>
            <div class="card-grid">
                <div class="card">
                    <img src="https://picsum.photos/400/200?random=1" alt="服务1">
                    <h3>网站设计</h3>
                    <p>专业的响应式网站设计服务，让您的业务在任何设备上都能完美展示。</p>
                    <a href="#" class="btn">了解更多</a>
                </div>
                <div class="card">
                    <img src="https://picsum.photos/400/200?random=2" alt="服务2">
                    <h3>移动应用</h3>
                    <p>原生和混合移动应用开发，覆盖iOS和Android平台。</p>
                    <a href="#" class="btn">了解更多</a>
                </div>
                <div class="card">
                    <img src="https://picsum.photos/400/200?random=3" alt="服务3">
                    <h3>技术咨询</h3>
                    <p>提供专业的技术咨询和解决方案，帮助您的业务数字化转型。</p>
                    <a href="#" class="btn">了解更多</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 响应式网站示例. 保留所有权利.</p>
    </footer>
</body>
</html>
