<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <title>我要吃卖卖</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #f0f4f8 0%, #e8eef4 100%); }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            gap: 60px;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .wheel-section { display: flex; flex-direction: column; align-items: center; }
        
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            transform-origin: center;
        }
        
        .wheel .segment { transition: filter 0.1s ease; }
        .wheel .segment.highlight { filter: brightness(1.3) drop-shadow(0 0 8px rgba(255,255,255,0.5)); }
        .wheel .segment:not(.highlight) { filter: brightness(0.7); }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        
        .pointer {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 35px solid #fff;
            z-index: 20;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
            pointer-events: none;
        }
        
        .pointer::after {
            content: '';
            position: absolute;
            top: -35px;
            left: -8px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 15px solid #667eea;
        }
        
        .buttons { margin-top: 30px; display: flex; gap: 20px; }
        
        .btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            color: #fff;
            -webkit-appearance: none;
            appearance: none;
            touch-action: manipulation;
        }
        
        .btn-start { background: linear-gradient(135deg, #4ecdc4, #44a3a0); }
        .btn-reset { background: linear-gradient(135deg, #95e1d3, #7bc9bc); }
        
        .result {
            margin-top: 20px;
            padding: 15px 30px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            min-width: 200px;
            text-align: center;
        }
        
        .list-section {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            min-width: 280px;
        }
        
        .list-section h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        
        .prize-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 10px;
        }
        
        .prize-item.highlight { background: rgba(78,205,196,0.1); }
        
        .prize-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 15px;
        }
        
        .prize-info { flex: 1; }
        .prize-name { font-weight: 600; color: #333; font-size: 15px; }
        .prize-percent { font-size: 12px; color: #999; }
        .prize-arrow { color: #999; font-size: 16px; }
        
        .color-full { background: linear-gradient(135deg, #FFA0A5, #E07078); }
        .color-free { background: linear-gradient(135deg, #9ED89A, #7BB877); }
        .color-20 { background: linear-gradient(135deg, #A3D4F0, #7AB4DF); }
        .color-50 { background: linear-gradient(135deg, #F8BFC6, #E895A0); }
        .color-80 { background: linear-gradient(135deg, #F5D98A, #E8C06A); }
        
        .calculator-section {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            min-width: 280px;
        }

        .calculator-section h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .multiplication-form {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding: 20px;
            background: #fafafa;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        .number-row {
            margin-bottom: 8px;
        }

        .number-row input {
            width: 100%;
            max-width: 180px;
            padding: 10px 12px;
            font-size: 18px;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: right;
            outline: none;
            transition: border-color 0.2s;
        }

        .number-row input:focus {
            border-color: #4ecdc4;
        }

        .operator-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }

        .operator {
            font-weight: bold;
            color: #666;
        }

        .discount {
            font-weight: bold;
            color: #4ecdc4;
            min-width: 60px;
            text-align: right;
        }

        .divider {
            width: 100%;
            max-width: 180px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4ecdc4, transparent);
            margin-bottom: 8px;
        }

        .result-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .result-label {
            color: #666;
            font-size: 14px;
        }

        .result-value {
            color: #4ecdc4;
            font-size: 24px;
        }

        @media (max-width: 767px) {
            .calculator-section { width: 100%; max-width: 320px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator-section">
            <h3>折扣计算器</h3>
            <div class="calculator">
                <div class="multiplication-form">
                    <div class="number-row">
                        <input type="number" id="multiplier" placeholder="金额" step="0.01" min="0">
                    </div>
                    <div class="operator-row">
                        <span class="operator">×</span>
                        <span class="discount" id="discountDisplay">100%</span>
                    </div>
                    <div class="divider"></div>
                    <div class="result-row">
                        <span class="result-label">应付:</span>
                        <span class="result-value" id="calculationResult">0.00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="wheel-section">
            <div class="wheel-container">
                <svg class="wheel" id="wheel" viewBox="0 0 300 300">
                    <defs>
                        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#E8868A"/><stop offset="100%" style="stop-color:#C45D63"/>
                        </linearGradient>
                        <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#7DB879"/><stop offset="100%" style="stop-color:#5A9656"/>
                        </linearGradient>
                        <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#7DB5E3"/><stop offset="100%" style="stop-color:#4A8AC4"/>
                        </linearGradient>
                        <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#F1A5AD"/><stop offset="100%" style="stop-color:#D47882"/>
                        </linearGradient>
                        <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#EDC46E"/><stop offset="100%" style="stop-color:#D4A54A"/>
                        </linearGradient>
                    </defs>
                    
                    <circle cx="150" cy="150" r="145" fill="none" stroke="#fff" stroke-width="8"/>
                    <circle cx="150" cy="150" r="8" fill="#fff" stroke="#ddd" stroke-width="2"/>
                </svg>
                <div class="pointer"></div>
            </div>
            <div class="buttons">
                <button class="btn btn-start" id="btnStart">开始</button>
                <button class="btn btn-reset" id="btnReset">重置</button>
            </div>
            <div class="result" id="result">这顿饭付多少钱？</div>
        </div>

        <div class="list-section">
            <h3>报销清单</h3>
            <div class="prize-item" data-prize="全价"><div class="prize-color color-full"></div><div class="prize-info"><div class="prize-name">全价</div><div class="prize-percent">概率: 5%</div></div><div class="prize-arrow">→</div></div>
            <div class="prize-item" data-prize="免单"><div class="prize-color color-free"></div><div class="prize-info"><div class="prize-name">免单</div><div class="prize-percent">概率: 15%</div></div><div class="prize-arrow">→</div></div>
            <div class="prize-item" data-prize="2折"><div class="prize-color color-20"></div><div class="prize-info"><div class="prize-name">2折</div><div class="prize-percent">概率: 20%</div></div><div class="prize-arrow">→</div></div>
            <div class="prize-item" data-prize="5折"><div class="prize-color color-50"></div><div class="prize-info"><div class="prize-name">5折</div><div class="prize-percent">概率: 25%</div></div><div class="prize-arrow">→</div></div>
            <div class="prize-item" data-prize="8折"><div class="prize-color color-80"></div><div class="prize-info"><div class="prize-name">8折</div><div class="prize-percent">概率: 35%</div></div><div class="prize-arrow">→</div></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var prizes = [
                { name: '全价', percent: 5, color: '#E8868A', gradient: 'url(#g1)' },
                { name: '免单', percent: 15, color: '#7DB879', gradient: 'url(#g2)' },
                { name: '2折', percent: 20, color: '#7DB5E3', gradient: 'url(#g3)' },
                { name: '5折', percent: 25, color: '#F1A5AD', gradient: 'url(#g4)' },
                { name: '8折', percent: 35, color: '#EDC46E', gradient: 'url(#g5)' }
            ];

            var prizeOrder = ['全价', '免单', '2折', '5折', '8折', '免单', '2折', '5折', '8折', '8折', '5折', '2折', '8折', '免单', '8折', '5折', '8折', '2折', '8折', '8折'];
            
            var prizeCountMap = { '全价': 1, '免单': 3, '2折': 4, '5折': 5, '8折': 7 };

            var wheel = document.getElementById('wheel');
            var btnStart = document.getElementById('btnStart');
            var btnReset = document.getElementById('btnReset');
            var result = document.getElementById('result');

            // 计算器相关变量
            var multiplierInput = document.getElementById('multiplier');
            var discountDisplay = document.getElementById('discountDisplay');
            var calculationResult = document.getElementById('calculationResult');
            var currentDiscount = 1; // 默认100%

            // 检查DOM元素是否存在
            if (!wheel || !btnStart || !btnReset || !result) {
                console.error('无法找到必要的DOM元素');
                return;
            }

            var centerX = 150;
            var centerY = 150;
            var radius = 145;

            function degToRad(deg) { return deg * Math.PI / 180; }
            
            function getPoint(angleDeg) {
                var angleRad = degToRad(angleDeg - 90);
                return {
                    x: centerX + radius * Math.cos(angleRad),
                    y: centerY + radius * Math.sin(angleRad)
                };
            }

            function initWheel() {
                var svgNS = 'http://www.w3.org/2000/svg';
                var segmentAngle = 18;
                
                prizeOrder.forEach(function(prizeName, index) {
                    var prize = prizes.find(function(p) { return p.name === prizeName; });
                    var startAngle = index * segmentAngle;
                    var endAngle = startAngle + segmentAngle;
                    
                    var start = getPoint(startAngle);
                    var end = getPoint(endAngle);
                    
                    var path = document.createElementNS(svgNS, 'path');
                    path.setAttribute('class', 'segment');
                    path.setAttribute('data-prize', prize.name);
                    path.setAttribute('data-index', index);
                    path.setAttribute('fill', prize.gradient);
                    path.setAttribute('d', 'M ' + centerX + ' ' + centerY + ' L ' + start.x + ' ' + start.y + ' A ' + radius + ' ' + radius + ' 0 0 1 ' + end.x + ' ' + end.y + ' Z');
                    wheel.appendChild(path);
                });
            }

            // 计算器函数
            function updateDiscount(discount) {
                currentDiscount = discount;
                discountDisplay.textContent = Math.round(discount * 100) + '%';
                calculateResult();
            }

            function calculateResult() {
                var multiplier = parseFloat(multiplierInput.value) || 0;
                var calcResult = multiplier * currentDiscount;
                calculationResult.textContent = calcResult.toFixed(2);
            }

            initWheel();
            
            // 在initWheel之后添加事件监听，确保DOM已加载
            multiplierInput.addEventListener('input', calculateResult);

            var isSpinning = false;
            var currentRotation = 0;

            function selectPrize() {
                var random = Math.random() * 100;
                var cumulative = 0;
                for (var i = 0; i < prizes.length; i++) {
                    cumulative += prizes[i].percent;
                    if (random <= cumulative) return prizes[i];
                }
                return prizes[prizes.length - 1];
            }

            function getPrizeStartAngle(prizeName) {
                var segmentAngle = 18;
                var firstIndex = prizeOrder.indexOf(prizeName);
                if (firstIndex === -1) return 0;
                return firstIndex * segmentAngle;
            }

            function getPrizeAtAngle(angle) {
                var segmentAngle = 18;
                var normalizedAngle = angle % 360;
                if (normalizedAngle < 0) normalizedAngle += 360;
                var index = Math.floor(normalizedAngle / segmentAngle);
                if (index >= prizeOrder.length) index = 0;
                var prizeName = prizeOrder[index];
                return { prize: prizes.find(function(p) { return p.name === prizeName; }), index: index };
            }

            btnStart.addEventListener('click', function() {
                if (isSpinning) return;
                
                isSpinning = true;
                btnStart.disabled = true;
                result.textContent = '今天付多少...';
                
                document.querySelectorAll('.highlight').forEach(function(el) { el.classList.remove('highlight'); });
                
                var selectedPrize = selectPrize();
                var prizeStartAngle = getPrizeStartAngle(selectedPrize.name);
                var segmentAngle = 18;
                var prizeAngle = segmentAngle;
                var randomSpins = 6 + Math.random() * 6;
                var randomOffset = (Math.random() - 0.5) * prizeAngle;
                var targetAngle = currentRotation + randomSpins * 360 + prizeStartAngle + prizeAngle / 2 + randomOffset;
                
                var startTime = performance.now();
                var duration = 15000;
                
                function animate(currentTime) {
                    var elapsed = currentTime - startTime;
                    var progress = Math.min(elapsed / duration, 1);
                    var easeOut = 1 - Math.pow(1 - progress, 4);
                    var rotation = currentRotation + (targetAngle - currentRotation) * easeOut;
                    
                    wheel.style.transform = 'rotate(' + rotation + 'deg)';
                    
                    var currentPointerAngle = (360 - rotation) % 360;
                    var currentResult = getPrizeAtAngle(currentPointerAngle);
                    
                    document.querySelectorAll('.segment').forEach(function(seg) {
                        if (parseInt(seg.dataset.index) === currentResult.index) {
                            seg.classList.add('highlight');
                        } else {
                            seg.classList.remove('highlight');
                        }
                    });
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        isSpinning = false;
                        btnStart.disabled = false;
                        currentRotation = rotation % 360;
                        
                        var pointerAngle = (360 - currentRotation) % 360;
                        var winner = getPrizeAtAngle(pointerAngle);
                        
                        var resultText = '';
                        var discount = 1; // 默认全价
                        switch(winner.prize.name) {
                            case '全价': resultText = '寄几付钱！🎉'; discount = 1; break;
                            case '免单': resultText = '全额报销！💳'; discount = 0; break;
                            case '2折': resultText = '报销80%！🎁'; discount = 0.2; break;
                            case '5折': resultText = '报销一半！❤️'; discount = 0.5; break;
                            case '8折': resultText = '报销20%！😊'; discount = 0.8; break;
                        }
                        result.textContent = resultText;
                        updateDiscount(discount);
                        
                        document.querySelectorAll('.prize-item').forEach(function(item) {
                            if (item.dataset.prize === winner.prize.name) item.classList.add('highlight');
                        });
                    }
                }
                
                requestAnimationFrame(animate);
            });

            btnReset.addEventListener('click', function() {
                isSpinning = false;
                btnStart.disabled = false;
                currentRotation = 0;
                wheel.style.transform = 'rotate(0deg)';
                result.textContent = '这顿饭付多少钱？';
                updateDiscount(1); // 重置为100%
                document.querySelectorAll('.segment').forEach(function(seg) {
                    seg.classList.remove('highlight');
                    seg.style.filter = '';
                });
                document.querySelectorAll('.prize-item').forEach(function(el) { el.classList.remove('highlight'); });
            });
        });
    </script>
</body>
</html>
